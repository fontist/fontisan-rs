[package]
name = "fontisan"
description = "Pure-Rust font engine (read, scan, audit, convert), with an optional versioned C ABI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# The C ABI source of truth. The gem's cdylib builds from the published crate
# with this feature on; `fontisan-ffi` is only a thin wrapper for C-side tests.
ffi = []

[dependencies]
# cmap subtable decoding (formats 4 and 12). Everything else in the sfnt model is a
# cursor-based reader that reproduces the Ruby reference's error surface, which
# read-fonts cannot (see docs/substrate.md, "1c outcome").
read-fonts = "=0.46.0"
# WOFF/WOFF2 decode (1e): both pure Rust, no *-sys / links (scripts/check-no-c.sh).
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
brotli-decompressor = { version = "=5.0.3", default-features = false, features = ["std"] }
# SHA-256 of the variation table digests (pure Rust).
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }
# 1b substrate spike (dev-only).
skrifa = "=0.49.0"
serde_json = "1"

[[bench]]
name = "abi"
harness = false
required-features = ["ffi"]

[[test]]
name = "ffi_abi"
required-features = ["ffi"]

[lints]
workspace = true

[[test]]
name = "ffi_leak"
required-features = ["ffi"]
