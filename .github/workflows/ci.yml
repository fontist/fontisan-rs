name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: ["1.85.0", stable] # 1.85.0 = workspace rust-version (MSRV)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Parity tests need the corpus, goldens and the pinned woff2 reference; without
      # them they skip, so CI fetches everything and turns a skip into a failure.
      - run: cargo xtask corpus-fetch
      - run: cargo xtask build-woff2
      - run: scripts/woff2-reference.sh .corpus/fontisan/corpus/fonts/.tools/woff2/bin/woff2_decompress .woff2-ref .corpus/fontisan/corpus
      - run: cargo test --workspace --all-features --locked
        env:
          FONTISAN_SPIKE_REQUIRE_CORPUS: "1"
          FONTISAN_WOFF2_REF_DIR: ${{ github.workspace }}/.woff2-ref
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo bench -p fontisan --features ffi --no-run --locked
      - run: scripts/c-abi-test.sh

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  check-no-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/check-no-c.sh

  xtask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --manifest-path xtask/Cargo.toml --locked -- -D warnings

  asan:
    name: ffi under AddressSanitizer (Linux nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: ffi tests with ASan + LeakSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1
        run: >
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p fontisan --features ffi --test ffi_abi --locked
