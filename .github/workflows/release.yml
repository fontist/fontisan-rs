name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # fontisan-ffi is a test wrapper with publish = false; only the engine ships.
      - name: Verify the publishable crate
        run: cargo publish -p fontisan --dry-run --locked
      # D3 (first crates.io publish) remains an owner decision. Until approved,
      # leave CARGO_REGISTRY_TOKEN unset. Manual runs always stop at the dry run.
      - name: Publish on a version tag when publishing is configured
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::notice::Publishing is disabled until a maintainer approves D3 and configures CARGO_REGISTRY_TOKEN.'
            exit 0
          fi
          cargo publish -p fontisan --locked
