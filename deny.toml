[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true  # fontisan-ffi (publish = false) uses a path dep on the engine
# `*-sys` bans are NOT done here: wildcard crate bans were measured to be a silent
# no-op (cargo-deny 0.20.2). scripts/check-no-c.sh enforces the no-C rule.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
