[package]
name = "fontisan-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Own workspace (like xtask): libfuzzer-sys and its nightly-only build never
# enter the engine graph.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fontisan = { path = "../crates/fontisan", features = ["ffi"] }

[profile.release]
debug = 1
panic = "unwind"

[[bin]]
name = "font_load"
path = "fuzz_targets/font_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font_tables"
path = "fuzz_targets/font_tables.rs"
test = false
doc = false
bench = false

